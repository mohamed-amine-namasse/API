<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorateur de Jeux Vidéo - RAWG API</title>
    <script type="module" crossorigin src="/assets/index-C1du7EQq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DLbisO93.css">
  </head>
  <body>
    <div class="gradient-background" aria-hidden="true">
      <div class="gradient-spheres">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
      </div>
      <div class="glow"></div>
      <div class="grid-overlay"></div>
      <div id="particles-container" class="particles-container"></div>
      <div class="noise-overlay"></div>
    </div>

    <header>
      <div class="header-container">
        <h1 id="homeBtn">
          <i
            data-lucide="gamepad-2"
            style="
              width: 28px;
              height: 28px;
              color: #fbbf24;
              margin-right: 0.5rem;
            "
          ></i>
          RAWG Explorer
        </h1>
        <div class="search-box">
          <i data-lucide="search" class="search-icon"></i>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Rechercher un jeu (ex: Witcher, Zelda)..."
          />
        </div>
      </div>
    </header>

    <main>
      <section id="gamesView">
        <div class="section-header">
          <h2>🔥 Jeux Tendances du Moment</h2>
          <span id="gameCount" class="badge">Chargement...</span>
        </div>

        <div id="loader" class="loader-container">
          <div class="spinner"></div>
        </div>

        <div id="gamesGrid" class="grid"></div>

        <div
          id="noResults"
          class="hidden text-center py-20"
          style="color: #64748b"
        >
          <p style="font-size: 1.125rem">
            Aucun jeu trouvé pour votre recherche.
          </p>
        </div>
      </section>
      <section id="gameDetails" class="hidden" aria-live="polite"></section>
    </main>
  </body>
</html>
